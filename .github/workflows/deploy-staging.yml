# Every push to `staging` deploys to https://staging.vertisglobal.com
#
# One step: an SSH session to the server as the `vertis` user with a key
# that authorized_keys locks to scripts/deploy-dispatch.sh. That script
# accepts the word `deploy-staging` and nothing else, then runs
# scripts/server-deploy.sh, which fetches, builds and reloads.
#
# Secret: STAGING_SSH_KEY (Settings → Secrets and variables → Actions),
# the private half of the CI key. The host key is pinned below.

name: Deploy staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://staging.vertisglobal.com
    steps:
      - name: Install deploy key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.STAGING_SSH_KEY }}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo '160.153.176.140 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKP+ACcAt98CeaqsXqm2UC+nniqpMCpRZnlfJ0Cbrjq0' > ~/.ssh/known_hosts
      - name: Deploy
        run: ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 vertis@160.153.176.140 deploy-staging
